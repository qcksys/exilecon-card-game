name: Check and deploy

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    VARLOCK_TELEMETRY_DISABLED: "1"
    ASTRO_TELEMETRY_DISABLED: "1"

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            # Checks don't need the real key; a process env value overrides the 1Password lookup.
            ANTHROPIC_API_KEY: ci-placeholder-not-a-key
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec biome ci
            - run: pnpm exec vitest run
            - run: pnpm exec astro check

    deploy:
        needs: check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-prod
            cancel-in-progress: false
        # No 1Password access in Actions: these repository secrets are mirrored from the
        # "exilecon-card-game" 1Password item (same names) and override the op() lookups in .env.schema.
        env:
            APP_ENV: prod
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            TURNSTILE_KEY: ${{ secrets.TURNSTILE_KEY }}
            TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        steps:
            - name: Check deploy secrets
              run: |
                  missing=0
                  for name in CLOUDFLARE_API_TOKEN ANTHROPIC_API_KEY TURNSTILE_KEY TURNSTILE_SECRET; do
                      if [ -z "${!name}" ]; then
                          echo "::error::Repository secret for $name is missing or empty (CLOUDFLARE_API_TOKEN comes from the CLOUDFLARE_ACCESS_TOKEN secret)."
                          missing=1
                      fi
                  done
                  exit $missing
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Check the prod env resolves
              run: pnpm exec varlock load
            - name: Build
              run: pnpm exec astro build
            - name: Deploy to card.poe.boats
              run: pnpm exec varlock-wrangler deploy
