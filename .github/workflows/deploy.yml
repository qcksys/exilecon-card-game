name: Check and deploy

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    VARLOCK_TELEMETRY_DISABLED: "1"
    ASTRO_TELEMETRY_DISABLED: "1"

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            # Checks don't need the real key; a process env value overrides the 1Password lookup.
            ANTHROPIC_API_KEY: ci-placeholder-not-a-key
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec biome ci
            - run: pnpm exec vitest run
            - run: pnpm exec astro check

    deploy:
        needs: check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-prod
            cancel-in-progress: false
        env:
            APP_ENV: prod
            OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        steps:
            - name: Check deploy secrets
              run: |
                  missing=0
                  if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then echo "::error::Add the OP_SERVICE_ACCOUNT_TOKEN repository secret (1Password service account that can read the site's item)."; missing=1; fi
                  if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Edit Cloudflare Workers on the QckSys account and the poe.boats zone)."; missing=1; fi
                  exit $missing
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Check the prod env resolves
              run: pnpm exec varlock load
            - name: Build
              run: pnpm exec astro build
            - name: Deploy to card.poe.boats
              run: pnpm exec varlock-wrangler deploy
